# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: regulatory-rag-assistant
metadata:
  template: regulatory-rag-assistant@2.0.0
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      # Built in Azure Container Registry: no local Docker needed.
      remoteBuild: true
hooks:
  postdeploy:
    posix:
      shell: sh
      run: ./scripts/postdeploy.sh
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/postdeploy.ps1
      interactive: false
      continueOnError: false
