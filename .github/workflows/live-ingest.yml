name: Live ingest
# Downloads the acts from the EU Publications Office, checks structure and article
# coverage on the real text, and runs the retrieval-only pilot. Catches upstream
# format or endpoint changes early.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths: [src/regrag/**, eval/**, scripts/check_corpus.py, pyproject.toml, .github/workflows/live-ingest.yml]
  push:
    branches: [main]
    paths: [src/regrag/**, eval/**, scripts/check_corpus.py, pyproject.toml, .github/workflows/live-ingest.yml]
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[local]"
      - run: python -m regrag ingest
      - name: Check corpus structure
        run: python scripts/check_corpus.py
      - name: Ten-question pilot, retrieval only
        run: python -m regrag eval --retrieval-only
      - name: Pilot summary
        if: always()
        run: |
          for f in .local/eval/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob(".local/eval/*.json")):
              report = json.load(open(path))
              for case in report["cases"]:
                  top = ", ".join(case.get("retrieved", [])[:3])
                  rank = case.get("expected_rank")
                  print(f"::notice title=pilot {case['id']}::{case['check']} (rank {rank}): {top}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus
          path: |
            .local/active.json
            .local/corpus/
            .local/eval/
          retention-days: 30
