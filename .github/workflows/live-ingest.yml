name: Live ingest
# Downloads the acts from the EU Publications Office, checks structure and article
# coverage on the real text, and runs the retrieval-only pilot. Catches upstream
# format or endpoint changes early.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths: [src/regrag/**, eval/**, scripts/check_corpus.py, pyproject.toml, .github/workflows/live-ingest.yml]
  push:
    branches: [main]
    paths: [src/regrag/**, eval/**, scripts/check_corpus.py, pyproject.toml, .github/workflows/live-ingest.yml]
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[local]"
      - run: python -m regrag ingest
      - name: Check corpus structure
        run: python scripts/check_corpus.py
      - name: Ten-question pilot, retrieval only
        run: python -m regrag eval --retrieval-only
      - name: Pilot summary
        if: always()
        run: |
          for f in .local/eval/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          python - <<'PY'
          import glob, json
          for path in sorted(glob.glob(".local/eval/*.json")):
              report = json.load(open(path))
              for case in report["cases"]:
                  top = ", ".join(case.get("retrieved", [])[:3])
                  print(f"::notice title=pilot {case['id']}::{case['check']}: {top}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: corpus
          path: |
            .local/active.json
            .local/corpus/
            .local/eval/
          retention-days: 30
