[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "2.0.0"
description = "Evidence-grounded RAG over the EU AI Act and DORA on Azure (AI Search, OpenAI, Container Apps)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.34.2,<3",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.68,<4",
  "azure-identity>=1.19,<2",
  "azure-search-documents>=12.1,<13",
  "azure-storage-blob>=12.20,<13",
  "azure-monitor-opentelemetry>=1.6,<2",
]

[project.optional-dependencies]
local = ["scikit-learn>=1.5,<2"]
dev = ["scikit-learn>=1.5,<2", "pytest>=9.2,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]

[project.scripts]
regrag = "regrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regrag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S311", "BLE001", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
